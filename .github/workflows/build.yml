name: Build Armor HUD Extra

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build
        run: gradle build --stacktrace

      - name: Prepare JAR
        run: |
          mkdir -p dist
          cp "$(find build/libs -maxdepth 1 -type f -name 'fixpots-armor-hud-extra-*.jar' ! -name '*-sources.jar' | head -n 1)" dist/fixpots-armor-hud-extra.jar

      - uses: actions/upload-artifact@v4
        with:
          name: fixpots-armor-hud-extra-1.0.0-mc26.3
          path: dist/fixpots-armor-hud-extra.jar
